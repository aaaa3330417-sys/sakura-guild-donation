  <style>
.hero-gif{
  display: block;

}

:root{
  --bg0:#0e1116;
  --bg1:#1a202c;

  --card:#ffffff;
  --card2:#fdf1f4;

  --line:rgba(255,255,255,.12);

  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.72);
  --muted2:rgba(255,255,255,.55);

  --accent:#e39aa8;
  --accent2:#d67b8c;

  --shadow:0 18px 50px rgba(0,0,0,.45);
  --radius:18px;
}

    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
background:
  radial-gradient(1200px 700px at 20% -10%, rgba(120,160,200,.18), transparent 60%),
  radial-gradient(1000px 600px at 85% 10%, rgba(180,120,140,.14), transparent 55%),

    #0e1116 0%,

    .wrap{max-width:1200px;margin:0 auto;padding:28px 18px 44px}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

    h1{font-size:34px;margin:10px 0 6px;letter-spacing:.5px}
/* ❄️ 強化版霜凍標題（亮底也清楚） */
.frozen-title{
  font-size:34px;
  margin:10px 0 6px;
  letter-spacing:1.2px;
  font-weight:900;

  /* 冰霜本體 */
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #ffe1ea 35%,
    #f2a8bd 60%,
    #ffffff 100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  /* 關鍵：深色輪廓 + 冷光 */
  text-shadow:
    0 1px 0 rgba(120,40,70,.55),      /* 下緣描邊 */
    0 0 6px rgba(255,255,255,.9),     /* 冰霧 */
    0 0 14px rgba(255,170,195,.75),   /* 粉霜光 */
    0 6px 18px rgba(0,0,0,.35);       /* 底部陰影 */
}

    .subtitle{color:var(--muted);margin:0 0 22px;font-size:14px}

    .grid{
      display:grid;
      grid-template-columns: 1.15fr .85fr;
      gap:18px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
    }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0)) , var(--card);
      border:1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      padding:18px 18px 10px;
      gap:12px;
    }
    .card-title{font-size:16px;margin:0}
    .card-sub{margin:6px 0 0;color:var(--muted2);font-size:12px}

    .controls{display:flex;align-items:center;gap:10px}
    .label{color:var(--muted2);font-size:12px;margin-right:4px}
    select{
      appearance:none;
      color:rgba(255,255,255,.9);
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;
      padding:8px 34px 8px 12px;
      outline:none;
      font-size:12px;
      cursor:pointer;
    }
    .select-wrap{position:relative}
    .select-wrap:after{
      content:"▾";
      position:absolute;
      right:12px;top:50%;
      transform:translateY(-52%);
      color:rgba(255,255,255,.55);
      pointer-events:none;
      font-size:12px;
    }

    .tabs{
      display:flex;gap:8px;flex-wrap:wrap;
      padding:0 18px 12px;
    }
    .tab{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      color:rgba(255,255,255,.82);
      padding:8px 12px;border-radius:999px;
      font-size:12px;cursor:pointer;
      transition:.15s transform, .15s background, .15s border-color;
      user-select:none;
    }
    .tab:hover{transform:translateY(-1px)}
    .tab.active{
      border-color:rgba(255,181,90,.45);
      background:linear-gradient(180deg, rgba(255,181,90,.18), rgba(255,122,69,.06));
      color:rgba(255,230,205,.96);
    }

    .table{padding:0 10px 12px}
    .thead,.trow{
      display:grid;
      grid-template-columns: 72px 1fr 160px;
      align-items:center;
      gap:10px;
      padding:10px 12px;
    }
    .thead{
      color:rgba(255,255,255,.6);
      font-size:11px;
      padding-top:6px;
    }
    .trow{
      border-top:1px solid var(--line);
      border-radius:12px;
    }
    .right{justify-self:end}
    .name{font-weight:600}
    .amount{font-variant-numeric: tabular-nums}

    .badge{
      width:34px;height:34px;border-radius:999px;
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:rgba(255,255,255,.86);
      font-weight:700;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .badge.gold{
      border-color:rgba(255,181,90,.55);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), transparent 55%),
                  linear-gradient(180deg, rgba(255,181,90,.55), rgba(255,122,69,.18));
    }
    .badge.silver{
      border-color:rgba(200,210,230,.55);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.18), transparent 55%),
                  linear-gradient(180deg, rgba(200,210,230,.45), rgba(160,170,200,.14));
    }
    .badge.bronze{
      border-color:rgba(255,160,120,.55);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.16), transparent 55%),
                  linear-gradient(180deg, rgba(255,160,120,.42), rgba(150,90,70,.14));
    }
/* 🌸 櫻花排名圓章（覆蓋原本 badge 樣式） */
.badge{
  color:#7a2f45;
  border:1px solid rgba(220,140,165,.55);

/* 🥉 第三名：櫻玫瑰粉 */
.badge.bronze{

    /* Recent */
    .recent .thead, .recent .trow{
      grid-template-columns: 190px 1fr 140px;
    }
    .date{color:rgba(255,255,255,.72);font-size:12px;font-variant-numeric: tabular-nums}

      padding:18px;

    }

    .footer-note{
      padding:0 18px 16px;
      color:rgba(255,255,255,.45);
      font-size:12px;
    }
/* 亮底黑字修正 */
.chip, .tab, select{ color: var(--text); }
.chip{
  border: 1px solid rgba(0,0,0,.08);
  background: rgba(255,255,255,.55);
}
.tab{
  border: 1px solid rgba(0,0,0,.08);
  background: rgba(255,255,255,.5);
}
select{
  background: rgba(255,255,255,.7);
  border: 1px solid rgba(0,0,0,.12);
}
.select-wrap:after{ color: rgba(0,0,0,.55); }

.thead{ color: var(--muted); }
.date{ color: var(--muted); }
.card-sub, .label, .footer-note{ color: var(--muted2); }

a{color:inherit}

/* ❄️ 自然背景雪（不跟滾輪） */
body{
  position: relative;
}

/* 左右雪幕 */
/* ❄️ 自然背景雪（固定在視窗上，動背景位置更明顯） */
body::before,
body::after{
  content:"";
  position:fixed;            /* ← 改 fixed 比 absolute 更穩 */
  top:0;
  bottom:0;
  width:26vw;
  pointer-events:none;
  z-index:1;
  opacity:.6;

  background-image:
    radial-gradient(circle, rgba(230,245,255,.9) 1.4px, transparent 3px),
    radial-gradient(circle, rgba(210,235,255,.7) 1.1px, transparent 2.6px),
    radial-gradient(circle, rgba(190,220,250,.5) 1px, transparent 2.4px);

  background-size:
    110px 110px,
    170px 170px,
    240px 240px;

  animation: snowBG 18s linear infinite;  /* ← 速度變快更有感 */
}

/* 左邊 */
body::before{
  left:0;
  -webkit-mask-image: linear-gradient(to right, #000 0%, #000 60%, transparent 100%);
          mask-image: linear-gradient(to right, #000 0%, #000 60%, transparent 100%);
}

/* 右邊 */
body::after{
  right:0;
  animation-duration: 24s; /* 右邊慢一點 */
  -webkit-mask-image: linear-gradient(to left, #000 0%, #000 60%, transparent 100%);
          mask-image: linear-gradient(to left, #000 0%, #000 60%, transparent 100%);
}

/* ✅ 用背景位置滾動，雪點會明顯往下飄 */
@keyframes snowBG{
  from{
    background-position: 0 0, 40px 80px, 80px 30px;
  }
  to{
    background-position: 0 260px, 40px 420px, 80px 560px;
  }
}

@keyframes slowSnow{
  from{ transform: translateY(0); }
  to  { transform: translateY(120px); }
}

/* 內容一定在雪上面 */
.wrap{
  position:relative;
  z-index:4;
}
/* ✨🎄 星星燈串（掛在頁面最上方） */
/* ✨🎄 星星燈串（掛在頁面最上方，不蓋字） */
.wrap::before{
  content:"";
  position:fixed;
  left:0;
  right:0;

  top:-50px;     /* 往上推，避免蓋到標題 */
  height:90px;   /* 燈串高度縮小 */

  pointer-events:none;
  z-index:6;

  /* 一排暖色燈泡：用多個 radial-gradient 做出 bokeh 燈 */
  background:
    radial-gradient(circle at 8% 60%,  rgba(255,220,150,.95) 0 10px, transparent 12px),
    radial-gradient(circle at 20% 40%, rgba(255,210,120,.85) 0 9px,  transparent 11px),
    radial-gradient(circle at 34% 55%, rgba(255,235,180,.95) 0 11px, transparent 13px),
    radial-gradient(circle at 48% 38%, rgba(255,200,120,.80) 0 9px,  transparent 11px),
    radial-gradient(circle at 62% 58%, rgba(255,230,170,.95) 0 11px, transparent 13px),
    radial-gradient(circle at 76% 42%, rgba(255,210,140,.85) 0 9px,  transparent 11px),
    radial-gradient(circle at 90% 60%, rgba(255,235,190,.95) 0 11px, transparent 13px);

  filter: drop-shadow(0 0 10px rgba(255,200,120,.35));
  animation: fairyTwinkle 2.8s ease-in-out infinite;
}

@keyframes fairyTwinkle{
  0%,100%{ opacity:.85; transform: translateY(0); }
  50%{ opacity:1; transform: translateY(1px); }
}
/* 🌙 深色卡片（像你照片那種） */
.card{
  background: linear-gradient(180deg, rgba(10,14,24,.88), rgba(6,10,18,.78));
  border: 1px solid rgba(255,255,255,.10);
  color: rgba(255,255,255,.92);
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
}

.card .card-sub,
.card .label,
.card .footer-note{
  color: rgba(255,255,255,.62);
}

.card .thead,
.card .date{
  color: rgba(255,255,255,.70);
}

/* 下拉在深色卡片上 */
.card select{
  color: rgba(255,255,255,.92);
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.14);
}
.card .select-wrap:after{ color: rgba(255,255,255,.65); }

/* 📋 表格列：深淺交錯 + 分隔線 */
.trow{
  border-top: 1px solid rgba(255,255,255,.06);
  border-radius: 12px;
}

/* 注意：因為 .thead 也算第一個孩子，所以第一列資料會從 even 開始 */
/* ✅ 深淺交錯（thead 不會影響） */
.table .trow:nth-of-type(odd){
  background: linear-gradient(180deg, rgba(0,0,0,.20), rgba(0,0,0,.10));
}
.table .trow:nth-of-type(even){
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
}

/* hover 提亮 */
.table .trow:hover{
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
}

/* 🖼 上方圖片左右並排、置中、整齊 */
/* 🖼 上方圖片用「跟 grid 一樣」的兩欄 */
.hero-row{
  display:grid;
  grid-template-columns: 1.15fr .85fr; /* ✅ 跟 .grid 一樣 */
  gap:18px;                             /* ✅ 跟 .grid 一樣 */
  align-items:center;
  margin: 18px 0 12px;
}

/* 左邊：對齊捐款總覽（左欄） */
.hero-left{
  justify-self:start;
}

/* 右邊：貓咪放右欄置中（可選） */
.hero-right{
  display:flex;
  justify-content:center;
}

/* 左邊公會合照：固定比例、裁切不變形 */
/* 左邊公會合照：完整顯示、不裁圖、寬度對齊卡片 */
.hero-side{
  width: 100%;        /* 跟捐款總覽同寬 */
  height: auto;       /* 高度交給圖片自己決定 */
  object-fit: contain;/* ✅ 不裁切 */
  border-radius: 18px;
  display: block;
}

/* 右邊貓咪：維持原本大小 */
.hero-center{
  width: 260px;
  max-width: 38vw;
}

/* 📱 手機 */
@media (max-width: 780px){
  .hero-side{ width: 92vw; max-width: 92vw; }
  .hero-center{ width: 260px; max-width: 70vw; }
}
/* 🎯 左邊圖片對齊捐款總覽 */
.hero-left{
  max-width: 100%;
}

/* ✅ 覆蓋 hero-gif 的置中 + 260px 限制，讓左圖跟左邊卡片同寬 */
.hero-left .hero-gif{
  margin: 0;        /* 不要 auto 置中 */
  max-width: none;  /* 取消 hero-gif 的 260px 限制 */
  width: 100%;
}
/* ✅ 標題小一點 */
.card-title{ font-size:15px; }

/* ✅ 副標小一點 */
.card-sub{ font-size:11px; }

/* ✅ 表頭小一點 */
.thead{ font-size:10.5px; }

/* ✅ 每列內容小一點 */
.trow{ font-size:12.5px; }

/* ✅ 金額更精緻 */
.amount{ font-size:12.5px; letter-spacing:.2px; }

/* ✅ 更像遊戲 UI：左右暗角＋中間亮 */
.table .trow{
  background:
    linear-gradient(90deg, rgba(0,0,0,.25), rgba(255,255,255,.03) 45%, rgba(0,0,0,.22)),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.08));
}

.table .trow:nth-of-type(even){
  background:
    linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.06) 45%, rgba(0,0,0,.18)),
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.04));
}
.badge{
  width:auto;height:22px;
  padding:0 10px;
  border-radius:999px;
  display:inline-grid;place-items:center;
  font-size:12px;font-weight:800;
  color: rgba(255,255,255,.90);
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 8px 18px rgba(0,0,0,.35);
}
/* 你原本的一堆 CSS 在上面 */

/* ✅ footer 備註文字微調 */
.footer-note{
  font-size:11.5px;
  letter-spacing:.3px;
  opacity:.8;
}
/* ✅ 修正 select 下拉選單文字消失 */
select option{
  color: #111;          /* 黑字 */
  background: #fff;     /* 白底 */
}

/* 📱 手機版專用排版修正 */
@media (max-width: 780px){

  /* 上方圖片改成直向排列 */
  .hero-row{
    grid-template-columns: 1fr;
    gap: 14px;
  }

  /* 公會合照：滿版、好看 */
  .hero-side{
    width: 100%;
    max-width: 100%;
    border-radius: 16px;
  }

  /* 貓咪動畫：縮小置中 */
  .hero-center{
    width: 200px;
    max-width: 80vw;
    margin: 0 auto;
  }

  /* 卡片左右不要貼邊 */
  .card{
    border-radius: 16px;
  }

  /* 表格字再小一點，避免擠 */
  .trow{
    font-size: 12px;
  }

  .amount{
    font-size: 12px;
  }
}

</style>
</head>

</div>
<script>
  // 1) https://script.google.com/macros/s/AKfycbxf5KQv2yqjJzyXU6mhHUajyA0IG5UbToORoEEClB_wx0arRMaPurJZz5bZHTo3ns9S/exec（回傳 JSON）
  // 例：https://script.google.com/macros/s/XXXX/exec
  const API_URL = "https://script.google.com/macros/s/AKfycbxf5KQv2yqjJzyXU6mhHUajyA0IG5UbToORoEEClB_wx0arRMaPurJZz5bZHTo3ns9S/exec";

  const els = {
    monthSelect: document.getElementById('monthSelect'),
    rankingTable: document.getElementById('rankingTable'),
    recentTable: document.getElementById('recentTable'),
    rankingState: document.getElementById('rankingState'),
    recentState: document.getElementById('recentState'),
    tabs: Array.from(document.querySelectorAll('.tab')),
  };

  const state = {
    tab: 'all',
    month: new URLSearchParams(location.search).get('month') || ''
  };

  function fmtGil(n){
    const x = Number(n || 0);
    return x.toLocaleString('en-US') + " gil";
  }

  function badgeHTML(rank){
    const n = Number(rank);
    if (n === 1) return `<div class="badge gold">1</div>`;
    if (n === 2) return `<div class="badge silver">2</div>`;
    if (n === 3) return `<div class="badge bronze">3</div>`;
    return `<div class="badge">${n}</div>`;
  }

  function setStateText(el, kind, text){
    el.className = kind; // loading/empty/error
    el.textContent = text;
  }

  function clearRows(container){
    container.querySelectorAll('.trow').forEach(n => n.remove());
  }

  function renderRanking(list){
    clearRows(els.rankingTable);

    if (!list || list.length === 0){
      setStateText(els.rankingState, 'empty', '目前沒有資料');
      return;
    }
    els.rankingState.remove();

    list.forEach(item => {
      const row = document.createElement('div');
      row.className = 'trow';
      row.innerHTML = `
        <div>${badgeHTML(item.rank)}</div>
        <div class="name">${escapeHtml(item.name ?? '')}</div>
        <div class="right amount">${fmtGil(item.total)}</div>
      `;
      els.rankingTable.appendChild(row);
    });
  }

  function renderRecent(list){
    clearRows(els.recentTable);

    if (!list || list.length === 0){
      setStateText(els.recentState, 'empty', '目前沒有紀錄');
      return;
    }
    els.recentState.remove();

    list.forEach(item => {
      const row = document.createElement('div');
      row.className = 'trow';
      row.innerHTML = `
        <div class="date">${formatDate(item.date)}</div>
        <div class="name">${escapeHtml(item.name ?? '')}</div>
        <div class="right amount">${fmtGil(item.amount)}</div>
      `;
      els.recentTable.appendChild(row);
    });
  }

  function formatDate(v){
    // Apps Script 回來可能是字串或日期字串；這裡盡量顯示好看
    if (!v) return '';
    const d = new Date(v);
    if (!isNaN(d.getTime())){
      const opt = { month:'short', day:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
      return d.toLocaleString('en-US', opt).replace(',', '');
    }
    return String(v);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function buildMonthOptions(){
    // 產生最近 12 個月下拉 + 全部期間
    const now = new Date();
    const opts = [''];
    for (let i=0;i<12;i++){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      opts.push(ym);
    }
    // 清空並重建
    els.monthSelect.innerHTML = `<option value="">全部期間</option>` + opts.slice(1).map(m => {
      return `<option value="${m}">${m}</option>`;
    }).join('');
    els.monthSelect.value = state.month;
  }

  function applyMonthToUrl(month){
    const u = new URL(location.href);
    if (month) u.searchParams.set('month', month);
    else u.searchParams.delete('month');
    history.replaceState({}, '', u);
  }

  function getApiUrl(){
    // 你目前 API（我們前面做的 doGet）會回 ranking+recent
    // 若你後端有支援月份/分隊，可改成：API_URL + '?month=...&tab=...'
    const u = new URL(API_URL);
    if (state.month) u.searchParams.set('month', state.month);
    if (state.tab && state.tab !== 'all') u.searchParams.set('tab', state.tab);
    return u.toString();
  }

  async function load(){
    if (!API_URL || API_URL.includes("PASTE_YOUR")) {
      setStateText(els.rankingState, 'error', '請先在 index.html 把 API_URL 換成你的 Apps Script Web App 網址');
      setStateText(els.recentState, 'error', '請先在 index.html 把 API_URL 換成你的 Apps Script Web App 網址');
      return;
    }

    try{
      // reset state nodes if removed previously
      if (!document.getElementById('rankingState')) {
        const n = document.createElement('div');
        n.id = 'rankingState';
        n.className = 'loading';
        n.textContent = '載入中…';
        els.rankingTable.appendChild(n);
        els.rankingState = n;
      }
      if (!document.getElementById('recentState')) {
        const n = document.createElement('div');
        n.id = 'recentState';
        n.className = 'loading';
        n.textContent = '載入中…';
        els.recentTable.appendChild(n);
        els.recentState = n;
      }
      setStateText(els.rankingState, 'loading', '載入中…');
      setStateText(els.recentState, 'loading', '載入中…');

      const res = await fetch(getApiUrl(), { cache: "no-store" });
      if (!res.ok) throw new Error(`API 回應失敗：${res.status}`);
      const data = await res.json();

      // data: { ranking: [{rank,name,total}], recent: [{date,name,amount}] }
      const ranking = data.ranking || [];
renderRanking(ranking);
renderRecent(data.recent || []);

const sum = ranking.reduce((acc, x) => acc + Number(x.total || 0), 0);
const gt = document.getElementById('grandTotal');
if (gt) gt.textContent = `累積總額：${fmtGil(sum)}`;

    }catch(err){
      setStateText(els.rankingState, 'error', '載入失敗：' + (err?.message || err));
      setStateText(els.recentState, 'error', '載入失敗：' + (err?.message || err));
    }
  }

  // Tabs
  els.tabs.forEach(t => {
    t.addEventListener('click', () => {
      els.tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      state.tab = t.dataset.tab;
      load();
    });
  });

  // Month dropdown
  els.monthSelect.addEventListener('change', () => {
    state.month = els.monthSelect.value;
    applyMonthToUrl(state.month);
    load();
  });

  buildMonthOptions();
  load();

  // 需要「每 30 秒更新」可打開這行
  // setInterval(load, 30000);
</script>
</body>
</html>
